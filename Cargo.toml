[package]
name = "pollen-succession-stage"
version = "0.1.0"
edition = "2021"
description = "孢粉演替台：湖芯孢粉计数、组成变换与生态带边界候选台"

[lib]
name = "pollen_stage"
path = "src/lib.rs"

[[bin]]
name = "pollen-stage"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
